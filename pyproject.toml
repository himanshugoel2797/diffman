[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffman"
version = "0.2.1"
description = "Track simulation-pipeline forks and the parameter differences at each fork. Browse runs via a web UI."
authors = [{name = "Himanshu Goel"}]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "watchdog>=4.0",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
hdf5 = ["h5py>=3.8"]
plotly = ["plotly>=5.18"]
all = ["h5py>=3.8", "plotly>=5.18"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
diffman = "diffman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diffman = ["ui/*.html", "ui/*.js", "ui/*.css"]

# ---------------------------------------------------------------------------
# pixi — optional project-local conda+pypi environment. Run with:
#     pixi run serve
# or `pixi shell` to use the `diffman` CLI directly.
# ---------------------------------------------------------------------------

[tool.pixi.workspace]
name = "diffman"
description = "Variant/cache/run manager + live-preview UI for simulation pipelines"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.11.*"
pip = "*"
numpy = ">=1.24"
scipy = ">=1.10"
matplotlib = ">=3.7"
pillow = ">=10.0"
h5py = ">=3.8"
git = "*"
# SRW Python bindings (provides `srwlib`, `srwlpy`, etc.). Pinned via conda
# so the native srwlpy ABI matches the env's Python.
srwpy = ">=4.1"

[tool.pixi.pypi-dependencies]
diffman = { path = ".", editable = true }
fastapi = ">=0.110"
uvicorn = { version = ">=0.27", extras = ["standard"] }
watchdog = ">=4.0"
plotly = ">=5.18"

[tool.pixi.tasks]
serve           = "diffman serve --scan-root . --root runs"
"serve-public"  = "diffman serve --scan-root . --root runs --bind 0.0.0.0"
scan            = "diffman scan ."
test            = "pytest tests/"
"check-srw"     = { cmd = "python -c 'import srwpy.srwlib as s; print(\"srwlib OK at\", s.__file__)'" }

